<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuento Infantil Ilustrado</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería PDF.js para procesar y extraer texto del PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <!-- Librería PageFlip para el efecto de paso de página -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
</head>
<body>
    <header class="header">
        <h1>📖 Cuento Mágico</h1>
        
        <!-- Barra de herramientas accesible -->
        <div class="controls-container">
            
            <!-- 4. Botones de Navegación en Forma de Corazón -->
            <div class="control-group navigation-group">
                <button id="prev-btn" class="btn-heart" aria-label="Página anterior" title="Página anterior">
                    <span class="heart-symbol">🩷</span>
                    <span class="btn-text">Anterior</span>
                </button>
                
                <span id="page-info" class="page-info">Página 1</span>
                
                <button id="next-btn" class="btn-heart" aria-label="Página siguiente" title="Página siguiente">
                    <span class="btn-text">Siguiente</span>
                    <span class="heart-symbol">🩷</span>
                </button>
            </div>

            <!-- 3. Lectura en Voz Alta -->
            <div class="control-group">
                <button id="tts-btn" class="btn btn-audio" aria-label="Leer en voz alta en español">
                    🔊 Leer en voz alta
                </button>
            </div>

            <!-- 3. Controles de Zoom para Baja Visión -->
            <div class="control-group">
                <button id="zoom-in-btn" class="btn btn-zoom" aria-label="Agrandar letra y vista">
                    🔍➕ Agrandar
                </button>
                <button id="zoom-out-btn" class="btn btn-zoom" aria-label="Achicar letra y vista">
                    🔍➖ Achicar
                </button>
                <button id="zoom-reset-btn" class="btn btn-zoom" aria-label="Restablecer tamaño">
                    🔄 Normal
                </button>
            </div>

            <!-- 6. Sonido de Pájaros y Naturaleza -->
            <div class="control-group">
                <button id="bird-sound-btn" class="btn btn-birds" aria-label="Activar o desactivar sonido de pájaros">
                    🐤 Pájaros: OFF
                </button>
            </div>
        </div>

        <div id="loading">✨ Abriendo el cuento...</div>
    </header>

    <main class="book-container">
        <!-- El libro flipbook se renderiza aquí -->
        <div id="flip-book" class="flip-book"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
